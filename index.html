<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="彭凯平的学习整理：生平、文化心理学研究、积极心理学观点、福流、五施法、积极教育、全部著作与目录。">
<title>彭凯平 · 积极心理学 — 渊默的学习小院</title>
<style>
:root{
  --bg:#f5f0ea;--panel:#fbf8f4;--ink:#2a2320;--soft:#6b5f58;--faint:#9a8e86;--line:#ddd1c6;
  --acc:#a8402f;--acc2:#7a6420;--acc-soft:#f1ddd5;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  --song:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#191513;--panel:#211c19;--ink:#e9e1da;--soft:#ab9e95;--faint:#7d716a;--line:#3a312c;--acc:#e8836e;--acc2:#d4b65a;--acc-soft:#3d2620;color-scheme:dark}
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--song);font-size:17px;line-height:1.9;padding:22px 18px 64px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto}
.home{font-size:.84rem;color:var(--soft);text-decoration:none;letter-spacing:.06em}
.home:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;margin:12px 0 14px}
.ttl{flex:1 1 360px;min-width:0}
h1{font-family:var(--kai);font-weight:400;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1.1;margin:0;letter-spacing:.12em}
.en{font-family:var(--sans);font-size:.9rem;color:var(--soft);margin:6px 0 0}
.find{flex:0 1 280px;min-width:0}
input[type=search]{font:inherit;font-size:.92rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:6px 12px;width:100%;border-radius:0}
.qres{border:1px solid var(--line);background:var(--panel);padding:10px 14px;margin-bottom:14px;max-height:340px;overflow-y:auto}
.qres p{margin:0 0 4px;font-size:.82rem;color:var(--soft)}
.qres button{display:block;width:100%;padding:4px 0;font-size:.92rem;line-height:1.6;border-top:1px dotted var(--line)}
.qres button b{font-weight:400;color:var(--acc);margin-right:8px}
.qres button:hover span{text-decoration:underline}
mark{background:var(--acc-soft);color:inherit}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:2px 18px;padding:8px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:26px}
nav.tabs a{font-family:var(--kai);font-size:1.06rem;color:var(--soft);text-decoration:none;border-bottom:2px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--acc);border-bottom-color:var(--acc)}
@media (max-width:760px){nav.tabs{position:static}}
main{max-width:860px}
h2{font-family:var(--kai);font-weight:400;font-size:clamp(1.8rem,5vw,2.3rem);line-height:1.25;margin:0 0 10px}
h3{font-family:var(--kai);font-weight:400;font-size:1.4rem;margin:36px 0 8px;color:var(--acc)}
h4{font-family:var(--kai);font-weight:400;font-size:1.15rem;margin:0}
p{margin:0 0 12px}
.lede{font-size:1.06rem;max-width:40em}
.soft{color:var(--soft)}
.fine{font-size:.86rem;color:var(--soft);border-left:2px solid var(--acc);padding-left:10px;max-width:46em}
.big{font-family:var(--kai);font-size:1.5rem;line-height:1.7;color:var(--acc);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:14px 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:12px 0}
.cards a{display:block;border:1px solid var(--line);background:var(--panel);padding:12px 14px;color:var(--ink);text-decoration:none}
.cards a:hover{border-color:var(--acc)}
.cards b{display:block;font-family:var(--kai);font-weight:400;font-size:1.15rem;color:var(--acc)}
.cards span{font-size:.88rem;color:var(--soft);line-height:1.6;display:block}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row h4 small{font-family:var(--sans);font-size:.78rem;color:var(--faint);margin-left:8px}
.row p{margin:4px 0 0}
ul.refs{margin:8px 0 0;padding-left:1.2em;font-size:.88rem;color:var(--soft)}
ul.take{margin:6px 0 0;padding-left:1.2em}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{display:grid;grid-template-columns:6.6em minmax(0,1fr);gap:0 14px;padding:6px 0;border-top:1px dotted var(--line)}
ol.tl b{font-weight:400;color:var(--acc);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 22px}
.grid2 div{padding:10px 0;border-top:1px solid var(--line)}
.grid2 p{font-size:.92rem;margin:2px 0 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{text-align:left;vertical-align:top;padding:6px 10px 6px 0;border-top:1px solid var(--line)}
th{font-weight:400;font-family:var(--kai);color:var(--soft)}
td.y{color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
td.j{font-family:var(--sans);font-size:.78rem;color:var(--faint)}
.tool{border:1px solid var(--line);background:var(--panel);padding:14px 16px;margin:14px 0}
.tool h3{margin-top:0}
.tool .src{font-size:.84rem;color:var(--soft)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.chips div{border-top:2px solid var(--acc);padding-top:6px}
.chips b{font-family:var(--kai);font-weight:400;font-size:1.25rem;color:var(--acc)}
.chips p{font-size:.92rem;margin:2px 0 0}
.seven{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.seven li{border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-size:.94rem}
.seven li::first-line{font-family:var(--kai);color:var(--acc)}
.blist{list-style:none;margin:0;padding:0}
.blist li{border-top:1px solid var(--line)}
.blist button{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:0 14px;width:100%;padding:12px 0}
.blist .y{font-family:var(--sans);color:var(--acc);font-variant-numeric:tabular-nums;padding-top:3px}
.blist b{font-family:var(--kai);font-weight:400;font-size:1.2rem}
.blist small{display:block;font-family:var(--sans);font-size:.76rem;color:var(--faint)}
.blist span.o{display:block;font-size:.92rem;color:var(--soft);line-height:1.65}
.blist button:hover b{color:var(--acc)}
.tag{display:inline-block;font-family:var(--sans);font-size:.72rem;color:var(--acc2);border:1px solid var(--acc2);padding:0 6px;margin-right:8px;vertical-align:2px;line-height:1.6}
.bk h2 small{display:block;font-family:var(--sans);font-size:.88rem;color:var(--soft);margin-top:4px}
.toc h4{color:var(--acc);margin-top:16px}
.toc ol{margin:4px 0 0;padding-left:1.6em;font-size:.95rem}
.toc ol li{padding:1px 0}
.bnav{display:flex;justify-content:space-between;gap:16px;margin-top:28px;font-family:var(--kai)}
.bnav button:hover{color:var(--acc)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:0 10px;padding:10px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);font-family:var(--sans);color:var(--panel);background:var(--acc);width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-size:.86rem;margin-top:.25em}
.steps p{margin:2px 0 0}
.src a{word-break:break-all}
footer{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--faint);max-width:60em}
</style>
</head>
<body>
<div class="wrap">
<a class="home" href="../">← 渊默的学习小院</a>
<header>
  <div class="ttl"><h1>彭凯平</h1><p class="en">Kaiping Peng · 1962— · 清华大学心理学教授 · 文化心理学与积极心理学</p></div>
  <div class="find"><input id="q" type="search" placeholder="搜：福流、五施、辩证、品格……" aria-label="搜索全站"></div>
</header>
<div id="qres" class="qres" hidden></div>
<nav class="tabs" id="tabs" aria-label="栏目">
  <a href="#/" data-t="">总览</a>
  <a href="#/life" data-t="life">生平</a>
  <a href="#/research" data-t="research">学术研究</a>
  <a href="#/ideas" data-t="ideas">核心观点</a>
  <a href="#/tools" data-t="tools">方法</a>
  <a href="#/edu" data-t="edu">积极教育</a>
  <a href="#/books" data-t="books">著作</a>
  <a href="#/learn" data-t="learn">怎么学</a>
</nav>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<script src="p1.js"></script>
<script src="p2.js"></script>
<script src="p3.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s),main=$("#main"),qres=$("#qres"),q=$("#q");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row=(h,p,sub)=>`<div class="row"><h4>${esc(h)}${sub?`<small>${esc(sub)}</small>`:""}</h4><p>${esc(p)}</p></div>`;
$("#foot").textContent=P.DISCLAIM;
const tool=t=>`<div class="tool"><h3>${esc(t.t)}</h3>${t.src?`<p class="src">${esc(t.src)}</p>`:""}<div class="chips">${t.items.map(x=>`<div><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join("")}</div></div>`;

const V={};
V[""]=()=>`<p class="big">幸福是一种有意义的快乐。</p>
<p class="lede">${esc(P.INTRO)}</p>
<h3>两段学术人生</h3>
<div class="grid2"><div><h4>在美国：文化心理学</h4><p>跟随尼斯贝特研究东西方的思维差异：中国人更看重情境与关系，面对矛盾倾向于“朴素辩证”。代表作是 1994 年的“文化与原因”和 1999 年的“文化、辩证法与矛盾推理”。</p></div><div><h4>在中国：积极心理学</h4><p>2008 年回清华重建心理学系，推广积极心理学和积极教育，把 flow 译作“福流”，提出“五施法”等日常方法，写了一系列大众读物。</p></div></div>
<h3>从这里开始</h3>
<div class="cards">
<a href="#/life"><b>生平</b><span>岳阳、北大、密歇根、伯克利、清华；年表、职务、荣誉、课程。</span></a>
<a href="#/research"><b>学术研究</b><span>归因、朴素辩证、整体思维、道德、敬畏、大数据；三十六篇代表论文。</span></a>
<a href="#/ideas"><b>核心观点</b><span>有意义的快乐、福流、积极天性、白熊效应、钱与幸福、中国文化。</span></a>
<a href="#/tools"><b>方法</b><span>五施法、调节情绪的八种方法、福流练习，可以直接用。</span></a>
<a href="#/edu"><b>积极教育</b><span>孩子的七种品格优势、王者之力、清华积极教育课程的六个模块。</span></a>
<a href="#/books"><b>著作</b><span>十余部书的出版信息、内容和完整目录。</span></a>
</div>
<h3>记住他的五句话</h3>
<ol class="steps">
<li><div><h4>幸福是有意义的快乐</h4><p>光有快乐不持久，光有意义太沉重。</p></div></li>
<li><div><h4>福流是幸福的基础</h4><p>目标明确、反馈及时、挑战与能力相当，人就会全神贯注、物我两忘。</p></div></li>
<li><div><h4>人有积极的天性</h4><p>同理、道德、合作、感恩是进化选择出来的，需要被唤醒。</p></div></li>
<li><div><h4>幸福要学习和练习</h4><p>积极不是终点，而是持续的行动：五施法、八种调节情绪的方法。</p></div></li>
<li><div><h4>文化塑造思维</h4><p>中国人看情境、看关系、容得下矛盾；西方心理学的结论需要在中国人身上重新检验。</p></div></li>
</ol>`;

V.life=()=>`<h2>生平</h2>
${P.LIFE.map(x=>`<h3>${esc(x[0])}</h3><p>${esc(x[1])}</p>`).join("")}
<h3>${esc(P.COVID[0])}</h3><p>${esc(P.COVID[1])}</p>
<h3>年表</h3><ol class="tl">${P.TIMELINE.map(x=>`<li><b>${esc(x[0])}</b><span>${esc(x[1])}</span></li>`).join("")}</ol>
<h3>职务与机构</h3><div class="grid2">${P.ROLES.map(x=>`<div><h4>${esc(x[0])}</h4><p>${esc(x[1])}</p></div>`).join("")}</div>
<h3>教学</h3>${P.TEACH.map(x=>row(x[0],x[1])).join("")}
<h3>荣誉</h3><ol class="tl">${P.HONORS.map(x=>`<li><b>${esc(x[0])}</b><span>${esc(x[1])}</span></li>`).join("")}</ol>`;

V.research=()=>`<h2>学术研究</h2><p class="lede">他的学术生涯有一条清楚的线：从“文化怎样塑造人的思维”出发，回国后转到“人怎样活得更好”。前者让他在国际心理学界成名，后者让他在中国家喻户晓。</p>
${P.RESEARCH.map(x=>`<div class="row"><h4>${esc(x[0])}<small>${esc(x[1])}</small></h4><p>${esc(x[2])}</p><ul class="refs">${x[3].map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`).join("")}
<h3>代表论文</h3><p class="fine">${esc(P.RESEARCH_NOTE)}</p>
<div class="tw"><table><thead><tr><th>年</th><th>作者</th><th>主题</th><th>期刊</th></tr></thead><tbody>${P.PAPERS.map(x=>`<tr><td class="y">${x[0]}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td class="j">${esc(x[3])}</td></tr>`).join("")}</tbody></table></div>`;

V.ideas=()=>`<h2>核心观点</h2><p class="lede">下面是他在书、课程、演讲和访谈中反复讲的观点，由编者归纳转述。</p>${P.IDEAS.map(x=>row(x[0],x[1])).join("")}`;

V.tools=()=>`<h2>方法</h2><p class="lede">他讲积极心理学，总会落到可以马上做的事上。这些方法简单，重在每天练。</p>
${tool(P.WUSHI)}${tool(P.BAZHEN)}${tool(P.FLOWTIPS)}
<h3>其他常讲的练习</h3>${P.OTHERTIPS.map(x=>row(x[0],x[1])).join("")}`;

V.edu=()=>`<h2>积极教育</h2><p class="lede">${esc(P.EDU.intro)}</p>
<h3>孩子的七种品格优势</h3><p class="soft">出自《孩子的品格》。</p><ul class="seven">${P.EDU.seven.map(x=>{const [a,b]=x.split("：");return `<li>${esc(a)}<br>${esc(b)}</li>`}).join("")}</ul><p>${esc(P.EDU.king)}</p>
<h3>清华积极教育课程</h3><p>${esc(P.EDU.course)}</p>
<h3>品格优势体系</h3><p>${esc(P.EDU.via)}</p>
<h3>幸福园丁</h3><p>${esc(P.EDU.gardener)}</p>
<p><a href="#/books/pinge">《孩子的品格》目录 →</a>　<a href="#/books/kecheng">《清华积极教育课程汇编》→</a>　<a href="#/books/hai">《嗨，别烦》→</a></p>`;

V.books=id=>{
  const i=P.BOOKS.findIndex(b=>b.id===id);
  if(i<0)return `<h2>著作</h2><p class="lede">按类型排列：大众读物、入门与教材、专业与学术。点书名看内容和目录。</p><p class="fine">出版信息和目录据出版社与豆瓣读书页面核对。“讲什么”依据官方简介和目录概括，编者没有通读原书。</p>
  <ul class="blist">${P.BOOKS.map(b=>`<li><button data-book="${b.id}"><span class="y">${esc(b.y)}</span><span><span class="tag">${esc(b.kind)}</span><b>${esc(b.t)}</b><small>${esc([b.pub,b.w].filter(Boolean).join(" · "))}</small><span class="o">${esc(b.one)}</span></span></button></li>`).join("")}</ul>`;
  const b=P.BOOKS[i],pv=P.BOOKS[i-1],nx=P.BOOKS[i+1];
  return `<div class="bk"><p><a href="#/books">← 全部著作</a></p><h2>${esc(b.t)}<small>${esc([b.pub,b.y,b.w].filter(Boolean).join(" · "))}</small></h2>
  <p class="big" style="font-size:1.25rem">${esc(b.one)}</p><h3>这本书讲什么</h3><p>${esc(b.about)}</p>
  ${b.toc.length?`<h3>目录</h3><div class="toc">${b.toc.map(p=>`${p[0]?`<h4>${esc(p[0])}</h4>`:""}<ol>${p[1].map(c=>`<li>${esc(c)}</li>`).join("")}</ol>`).join("")}</div>${b.note?`<p class="fine" style="margin-top:12px">${esc(b.note)}</p>`:""}`:""}
  <div class="bnav">${pv?`<button data-book="${pv.id}">← ${esc(pv.t.split("：")[0])}</button>`:"<span></span>"}${nx?`<button data-book="${nx.id}">${esc(nx.t.split("：")[0])} →</button>`:"<span></span>"}</div></div>`;
};

V.learn=()=>`<h2>怎么学</h2><ol class="steps">${P.PATH.map(x=>`<li><div><h4>${esc(x[0])}</h4><p>${esc(x[1])}</p></div></li>`).join("")}</ol>
<p style="margin-top:16px">相关专页：<a href="../flow/">契克森米哈赖 · 心流</a>　<a href="../yangming/">王阳明</a></p>
<h3>本站资料来源</h3><ul class="take src">${P.SOURCES.map(x=>`<li><a href="${esc(x[1])}" rel="noopener">${esc(x[0])}</a></li>`).join("")}</ul>
<p class="fine" style="margin-top:14px">${esc(P.DISCLAIM)}</p>`;

function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/"),t=p[0]||"";
  document.querySelectorAll("#tabs a").forEach(a=>a.removeAttribute("aria-current"));
  const cur=document.querySelector(`#tabs a[data-t="${t}"]`);if(cur)cur.setAttribute("aria-current","page");
  main.innerHTML=(V[t]||V[""])(p[1]);window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{const b=e.target.closest("[data-book]");if(b)location.hash="#/books/"+b.dataset.book});

const IDX=[],add=(w,r,t,x)=>IDX.push({w,r,t,x:String(x)});
P.LIFE.forEach(x=>add("生平","life",x[0],x[1]));P.TIMELINE.forEach(x=>add("年表","life",x[0],x[1]));P.ROLES.forEach(x=>add("职务","life",x[0],x[1]));P.TEACH.forEach(x=>add("教学","life",x[0],x[1]));add("生平","life",P.COVID[0],P.COVID[1]);
P.RESEARCH.forEach(x=>add("学术研究","research",x[0],x[2]+x[3].join("")));P.PAPERS.forEach(x=>add("论文","research",x[0]+" "+x[2],x[1]+x[3]));
P.IDEAS.forEach(x=>add("核心观点","ideas",x[0],x[1]));
[P.WUSHI,P.BAZHEN,P.FLOWTIPS].forEach(t=>t.items.forEach(x=>add(t.t,"tools",x[0],x[1])));P.OTHERTIPS.forEach(x=>add("方法","tools",x[0],x[1]));
add("积极教育","edu","七种品格优势",P.EDU.seven.join("")+P.EDU.king);add("积极教育","edu","清华积极教育课程",P.EDU.course);
